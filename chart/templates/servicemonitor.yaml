{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "car-api.fullname" . }}
  labels:
    {{- include "car-api.labels" . | nindent 4 }}
    # Obligatorio: el Prometheus del clúster (gitops/platform/monitoring)
    # solo hace caso a los ServiceMonitor con esta etiqueta exacta
    # (serviceMonitorSelector.matchLabels), verificado contra el recurso
    # Prometheus real desplegado. Sin ella, Prometheus lo ignora en
    # silencio, sin ningún error.
    release: monitoring
spec:
  selector:
    matchLabels:
      {{- include "car-api.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
{{- end }}
