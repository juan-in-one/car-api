image:
  repository: ghcr.io/juan-in-one/car-api
  tag: "latest"
  pullPolicy: IfNotPresent

# Vacío por defecto (útil en local con imagen ya cargada, como en las pruebas
# de hoy). En real, ArgoCD lo rellena con un Secret dockerconfigjson creado
# aparte en el clúster (no en Git) — ver gitops/apps/car-api.yaml.
imagePullSecrets: []

# Ignorado si autoscaling.enabled es true (el HPA manda en ese caso)
replicaCount: 1

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: car-api.local
  path: /

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Hardening pedido por Trivy config (KSV-0001/0003/0004/0012/0014/0020/0021/
# 0030/0104/0106/0118) — mismo UID/GID que crea el Dockerfile (10001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Valor de desarrollo, igual al de .env.example. NO usar en real: la gestión de
# secretos de verdad (Sealed Secrets / External Secrets / SOPS) llega en un paso
# posterior del roadmap (ArgoCD + gestión de secretos).
secret:
  databaseUrl: "postgresql+asyncpg://car_api:car_api@localhost:5432/car_api"
