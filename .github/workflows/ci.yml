name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permiso explícito para que el GITHUB_TOKEN automático de esta ejecución
# pueda publicar paquetes (imágenes) en GHCR. Por defecto viene en solo lectura.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # se resuelve a "juan-in-one/car-api"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Trivy — escaneo de configuración (Dockerfile + chart de Helm)
        # "config" analiza IaC: malas prácticas de seguridad en el propio
        # Dockerfile y en el chart de Helm (Trivy renderiza el chart él solo,
        # no hace falta pasarle el YAML ya generado a mano).
        # Salida en tabla en vez de SARIF: la pestaña "Security" de GitHub
        # (Code Scanning) requiere Advanced Security, que no está disponible
        # en repos privados con plan Free — ver wiki/projects/juan-in-one.md.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          output: trivy-config.txt
          exit-code: "0" # no bloquea main todavía, ver comentario más abajo

      - name: Volcar hallazgos de configuración al resumen del job
        if: always()
        run: |
          {
            echo "## 🛡️ Trivy — configuración (Dockerfile + chart)"
            echo '```'
            cat trivy-config.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Semgrep — análisis estático del código (SAST)
        # A diferencia de Trivy (versiones vulnerables / config), Semgrep lee
        # la estructura real del código Python en busca de patrones inseguros
        # conocidos (SQL injection, deserialización insegura, CORS mal
        # configurado...). Reglas OSS gratuitas, sin cuenta ni API key.
        run: |
          pip install --quiet semgrep
          semgrep scan \
            --config p/security-audit \
            --config p/python \
            --text --output semgrep.txt \
            app/

      - name: Volcar hallazgos de Semgrep al resumen del job
        if: always()
        run: |
          {
            echo "## 🔎 Semgrep — análisis estático del código (SAST)"
            echo '```'
            cat semgrep.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Autenticarse en GHCR
        # Solo publicamos imagen cuando el trigger es un push (no en PRs, para
        # no llenar el registro de imágenes de ramas que aún no se han fusionado).
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # "load: true" deja la imagen cargada en el Docker del propio runner,
          # así el siguiente paso puede escanearla sin tener que autenticarse
          # contra GHCR ni volver a descargarla.
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trivy — escaneo de vulnerabilidades de la imagen
        # "image" analiza CVEs conocidas en el sistema operativo base y en las
        # dependencias Python instaladas dentro de la imagen ya construida.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          output: trivy-image.txt
          exit-code: "0" # no bloquea main todavía, ver comentario más abajo

      - name: Volcar hallazgos de la imagen al resumen del job
        if: always()
        run: |
          {
            echo "## 🛡️ Trivy — vulnerabilidades de la imagen"
            echo '```'
            cat trivy-image.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
